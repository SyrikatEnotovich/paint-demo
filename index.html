<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Акварельная раскраска — плавная музыка и облака в саду</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
        body{background:#e2d8cd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;}
        .menu-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,250,242,0.97);backdrop-filter:blur(8px);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.4s;}
        .menu-content{text-align:center;max-width:800px;width:90%;padding:20px;background:#fffaf5;border-radius:64px;box-shadow:0 20px 40px rgba(0,0,0,0.1);}
        .menu-content h2{font-size:2rem;color:#a06e42;margin-bottom:10px;}
        .menu-content p{color:#b48c60;margin-bottom:30px;}
        .picture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-bottom:30px;}
        .picture-card{background:#fff3e8;border-radius:32px;padding:12px 8px;cursor:pointer;transition:0.2s;text-align:center;}
        .picture-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,0.1);}
        .picture-card .emoji{font-size:2.5rem;display:block;margin-bottom:8px;}
        .picture-card .title{font-weight:600;color:#7c5f3a;font-size:0.9rem;}
        .import-btn{background:#ffdfb5;border:none;font-size:1rem;font-weight:bold;padding:12px 24px;border-radius:60px;cursor:pointer;margin-top:10px;font-family:inherit;color:#6b4c2c;}
        .game-container{display:none;background:#fffaf5;border-radius:48px;box-shadow:0 20px 35px rgba(0,0,0,0.08);padding:20px;}
        .canvas-layer{position:relative;width:700px;height:500px;margin:0 auto;border-radius:24px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.12);}
        canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:24px;}
        #paintCanvas{background:#fefaf5;z-index:1;}
        #outlineCanvas{background:transparent;z-index:2;pointer-events:none;}
        .toolbar{margin-top:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;}
        .color-palette{display:flex;gap:8px;background:#fff3e8;padding:6px 12px;border-radius:60px;flex-wrap:wrap;justify-content:center;max-width:300px;}
        .color-btn{width:34px;height:34px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.1);cursor:pointer;}
        .color-btn.active{transform:scale(1.15);border-color:#ffb882;}
        .mode-switch{background:#fff3e8;padding:5px 12px;border-radius:40px;display:flex;gap:6px;}
        .mode-btn{background:#f0e4d4;border:none;font-size:0.75rem;font-weight:600;padding:5px 12px;border-radius:30px;cursor:pointer;color:#7c5f3a;}
        .mode-btn.active{background:#ffdfb5;}
        .mode-btn.disabled{opacity:0.5;pointer-events:none;}
        .brush-size{background:#fff3e8;padding:5px 12px;border-radius:40px;display:flex;align-items:center;gap:8px;font-weight:600;color:#7c5f3a;font-size:0.8rem;}
        input[type="range"]{width:100px;cursor:pointer;}
        button{background:#ffdfb5;border:none;font-weight:bold;padding:5px 12px;border-radius:60px;cursor:pointer;color:#6b4c2c;font-size:0.8rem;}
        .undo-redo{display:flex;gap:5px;background:#fff3e8;padding:5px 12px;border-radius:40px;}
        .sound-group{display:flex;gap:5px;background:#fff3e8;padding:3px 8px;border-radius:40px;}
        .sound-btn{background:#ffe0b5;border:none;font-size:1rem;padding:5px 10px;border-radius:40px;cursor:pointer;}
    </style>
</head>
<body>
<div id="menuOverlay" class="menu-overlay">
    <div class="menu-content">
        <h2>🌸 акварельная мастерская 🌸</h2>
        <p>выбери картинку для раскрашивания</p>
        <div class="picture-grid" id="pictureGrid"></div>
        <button id="importMenuBtn" class="import-btn">📷 загрузить свою картинку</button>
        <input type="file" id="menuFileInput" accept="image/jpeg,image/png,image/jpg" style="display:none">
    </div>
</div>
<div id="gameContainer" class="game-container">
    <div class="canvas-layer">
        <canvas id="paintCanvas" width="700" height="500"></canvas>
        <canvas id="outlineCanvas" width="700" height="500"></canvas>
    </div>
    <div class="toolbar">
        <div class="color-palette" id="palette"></div>
        <div class="mode-switch">
            <button id="brushModeBtn" class="mode-btn active">🖌️ акварель</button>
            <button id="penModeBtn" class="mode-btn">✏️ ручка</button>
            <button id="fillModeBtn" class="mode-btn">✨ заливка</button>
        </div>
        <div class="brush-size">
            <span>🎨 размер</span>
            <input type="range" id="brushRange" min="2" max="50" value="28" step="1">
            <span id="brushSizeVal">28</span>
        </div>
        <div class="undo-redo">
            <button id="undoBtn" title="Отменить (Ctrl+Z)">↩️</button>
            <button id="redoBtn" title="Повторить (Ctrl+Y)">↪️</button>
        </div>
        <div class="sound-group">
            <button id="musicToggleBtn" class="sound-btn">🎵</button>
            <button id="soundToggleBtn" class="sound-btn">🔇</button>
        </div>
        <button id="clearBtn">🌊 очистить</button>
        <button id="backToMenuBtn">📁 меню</button>
    </div>
</div>

<script>
(function(){
    const W = 700, H = 500;
    const paintCanvas = document.getElementById('paintCanvas');
    const outlineCanvas = document.getElementById('outlineCanvas');
    const ctx = paintCanvas.getContext('2d');
    const ctxOutline = outlineCanvas.getContext('2d');
    paintCanvas.width = W; paintCanvas.height = H;
    outlineCanvas.width = W; outlineCanvas.height = H;

    // ---------- ФОНОВАЯ МУЗЫКА (непрерывная, плавная) ----------
    let musicEnabled = false;
    let musicCtx = null;
    let musicSource = null;
    let musicInitialized = false;
    let musicLoopInterval = null;

    function initMusic() {
        if (musicInitialized) return;
        musicCtx = new (window.AudioContext || window.webkitAudioContext)();
        // тихий щелчок для активации
        const osc = musicCtx.createOscillator();
        const gain = musicCtx.createGain();
        osc.connect(gain);
        gain.connect(musicCtx.destination);
        gain.gain.value = 0;
        osc.start();
        osc.stop(0.01);
        musicCtx.resume();
        musicInitialized = true;
    }

    // Плавная музыка: бесконечная последовательность нот с перекрытием
    function startMusic() {
        if (!musicEnabled || !musicCtx) return;
        if (musicLoopInterval) clearInterval(musicLoopInterval);
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; // до-ре-ми-фа-соль-ля-си-до
        let noteIndex = 0;
        let nextTime = musicCtx.currentTime;
        const scheduleAhead = 0.2;
        function scheduleNote() {
            if (!musicEnabled) return;
            const now = musicCtx.currentTime;
            if (nextTime < now) nextTime = now;
            const osc = musicCtx.createOscillator();
            const gain = musicCtx.createGain();
            osc.connect(gain);
            gain.connect(musicCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = notes[noteIndex % notes.length];
            gain.gain.setValueAtTime(0.06, nextTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, nextTime + 0.7);
            osc.start(nextTime);
            osc.stop(nextTime + 0.7);
            noteIndex++;
            nextTime += 0.6; // перекрытие 0.1 с (нота звучит 0.7, пауза 0.6 -> наложение)
            musicLoopInterval = setTimeout(scheduleNote, 600);
        }
        scheduleNote();
    }
    function stopMusic() {
        if (musicLoopInterval) clearTimeout(musicLoopInterval);
        musicLoopInterval = null;
    }

    const musicBtn = document.getElementById('musicToggleBtn');
    musicBtn.onclick = () => {
        musicEnabled = !musicEnabled;
        musicBtn.innerText = musicEnabled ? '🎵🔊' : '🎵';
        if (musicEnabled) {
            initMusic();
            startMusic();
        } else {
            stopMusic();
        }
    };

    // Активация по первому касанию холста
    function enableMusicOnTouch() {
        if (musicEnabled && !musicInitialized) initMusic();
        paintCanvas.removeEventListener('touchstart', enableMusicOnTouch);
        paintCanvas.removeEventListener('mousedown', enableMusicOnTouch);
    }
    paintCanvas.addEventListener('touchstart', enableMusicOnTouch);
    paintCanvas.addEventListener('mousedown', enableMusicOnTouch);

    // ---------- ЗВУК ПТИЧЕК (только для сада) ----------
    let soundEnabled = false;
    let audioCtx = null;
    let soundInterval = null;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0;
            osc.start();
            osc.stop(0.01);
            audioCtx.resume();
            audioInitialized = true;
        } catch(e) { console.log("Audio not supported"); }
    }

    function playBirdSound() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200 + Math.random() * 800;
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        osc.start();
        osc.stop(now + 0.5);
    }

    function startNatureSound() {
        if (soundEnabled && currentPicture === 'garden') {
            if (soundInterval) clearInterval(soundInterval);
            soundInterval = setInterval(() => {
                if (soundEnabled && currentPicture === 'garden') playBirdSound();
            }, 7000);
        } else {
            if (soundInterval) clearInterval(soundInterval);
        }
    }
    function stopNatureSound() {
        if (soundInterval) clearInterval(soundInterval);
    }

    const soundBtn = document.getElementById('soundToggleBtn');
    soundBtn.onclick = () => {
        soundEnabled = !soundEnabled;
        soundBtn.innerText = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) {
            initAudio();
            if (currentPicture === 'garden') startNatureSound();
        } else {
            stopNatureSound();
        }
    };

    function enableAudioOnTouch() {
        if (soundEnabled && !audioInitialized) initAudio();
        paintCanvas.removeEventListener('touchstart', enableAudioOnTouch);
        paintCanvas.removeEventListener('mousedown', enableAudioOnTouch);
    }
    paintCanvas.addEventListener('touchstart', enableAudioOnTouch);
    paintCanvas.addEventListener('mousedown', enableAudioOnTouch);

    // ---------- ИСТОРИЯ (UNDO/REDO) ----------
    let historyStack = [];
    let historyIndex = -1;
    const MAX_HISTORY = 40;
    function saveState() {
        const imageData = ctx.getImageData(0, 0, W, H);
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(imageData);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
        else historyIndex = historyStack.length - 1;
    }
    function restoreState(index) {
        if (index < 0 || index >= historyStack.length) return;
        ctx.putImageData(historyStack[index], 0, 0);
        historyIndex = index;
    }
    function undo() { if (historyIndex > 0) restoreState(historyIndex - 1); }
    function redo() { if (historyIndex < historyStack.length - 1) restoreState(historyIndex + 1); }

    // ---------- НАСТРОЙКИ РИСОВАНИЯ ----------
    const paletteColors = [
        '#FFB7B2','#FF8A8A','#FFE4A0','#FFD966','#B8E0D2','#8AD0B0',
        '#B8D4F0','#7FB4FF','#F5CFDF','#FFB7D5','#FFD4B8','#FFB347','#E0D0F0','#C5A3FF'
    ];
    let currentColor = paletteColors[0];
    let brushSize = 28;
    let drawing = false;
    let lastX = 0, lastY = 0;
    let mode = 'brush'; // brush, pen, fill
    let currentPicture = null;
    let importedImageData = null;
    const CONTOUR_COLOR = '#8b7a66';

    // АКВАРЕЛЬНЫЙ МАЗОК
    function makeAiry(color, percent = 60) {
        let r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
        r = Math.min(255, r + (255 - r) * percent / 100);
        g = Math.min(255, g + (255 - g) * percent / 100);
        b = Math.min(255, b + (255 - b) * percent / 100);
        return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
    }
    function watercolorDot(x, y, rad, color, isEdge = false) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        let airyColor = makeAiry(color, 62);
        let alpha = isEdge ? 0.12 : 0.09;
        ctx.globalAlpha = alpha + Math.random() * 0.06;
        ctx.beginPath();
        ctx.ellipse(x, y, rad, rad*0.7, 0, 0, Math.PI*2);
        ctx.fillStyle = airyColor;
        ctx.fill();
        let tentacles = isEdge ? 10+Math.random()*8 : 6+Math.random()*6;
        for(let i=0;i<tentacles;i++){
            let ang = Math.random()*Math.PI*2;
            let dist = rad*(0.6+Math.random()*1.4);
            let offX = x + Math.cos(ang)*dist;
            let offY = y + Math.sin(ang)*dist;
            let r2 = rad*(0.2+Math.random()*0.5);
            ctx.globalAlpha = (isEdge?0.09:0.05)+Math.random()*0.05;
            ctx.beginPath();
            ctx.ellipse(offX+(Math.random()-0.5)*8, offY+(Math.random()-0.5)*8, r2, r2*0.5, 0,0,Math.PI*2);
            ctx.fillStyle = airyColor;
            ctx.fill();
        }
        ctx.globalAlpha = 0.04;
        ctx.beginPath();
        ctx.ellipse(x, y, rad*1.6, rad*1.3, 0,0,Math.PI*2);
        ctx.fillStyle = airyColor;
        ctx.fill();
        ctx.restore();
    }
    function penDot(x, y, rad, color) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        ctx.ellipse(x, y, rad, rad*0.75, 0, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
    }
    function drawStroke(x, y, size, color, toolMode) {
        if(toolMode === 'pen') penDot(x, y, size/2, color);
        else watercolorDot(x, y, size/2, color, false);
    }

    // ---------- ОБЛАСТИ ЗАЛИВКИ ----------
    // Домик
    const houseAreas = {
        roof: { contains:(x,y)=>{ let x1=260,y1=280,x2=440,y2=280,x3=350,y3=210; let b0=(x2-x1)*(y3-y1)-(x3-x1)*(y2-y1); if(b0===0) return false; let b1=((x2-x)*(y3-y)-(x3-x)*(y2-y))/b0; let b2=((x3-x)*(y1-y)-(x1-x)*(y3-y))/b0; let b3=((x1-x)*(y2-y)-(x2-x)*(y1-y))/b0; return b1>0 && b2>0 && b3>0; }, getPoint:()=>{ let x,y; do{x=260+Math.random()*180; y=210+Math.random()*70;} while(!houseAreas.roof.contains(x,y)); return {x,y}; } },
        wall: { contains:(x,y)=> x>=280 && x<=420 && y>=280 && y<=400, getPoint:()=>({x:280+Math.random()*140, y:280+Math.random()*120}) },
        door: { contains:(x,y)=> x>=340 && x<=380 && y>=340 && y<=400, getPoint:()=>({x:340+Math.random()*40, y:340+Math.random()*60}) },
        window: { contains:(x,y)=> x>=300 && x<=335 && y>=310 && y<=345, getPoint:()=>({x:300+Math.random()*35, y:310+Math.random()*35}) },
        sun: { contains:(x,y)=> Math.hypot(x-600,y-140)<=32, getPoint:()=>{ let r=Math.sqrt(Math.random())*32, a=Math.random()*Math.PI*2; return {x:600+Math.cos(a)*r, y:140+Math.sin(a)*r}; } },
        cloud1: { contains:(x,y)=> Math.pow((x-155)/50,2)+Math.pow((y-95)/30,2)<=1, getPoint:()=>{ let a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random()); return {x:155+Math.cos(a)*r*50, y:95+Math.sin(a)*r*30}; } },
        cloud2: { contains:(x,y)=> Math.pow((x-595)/50,2)+Math.pow((y-75)/28,2)<=1, getPoint:()=>{ let a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random()); return {x:595+Math.cos(a)*r*50, y:75+Math.sin(a)*r*28}; } },
        heart: { contains:(x,y)=>{ let dx=x-485, dy=y-315; let left=Math.hypot(dx+14,dy-8)<=18; let right=Math.hypot(dx-14,dy-8)<=18; let lower=(Math.abs(dx)<=20 && dy>=-4 && dy<=28 && dy>Math.abs(dx)*0.7-6); return left||right||lower; }, getPoint:()=>{ let x,y; do{x=455+Math.random()*60; y=295+Math.random()*50;} while(!houseAreas.heart.contains(x,y)); return {x,y}; } }
    };
    // Лес
    const forestAreas = {
        treeCrown: { contains:(x,y)=>{ let x1=350,y1=150,x2=280,y2=280,x3=420,y3=280; let b0=(x2-x1)*(y3-y1)-(x3-x1)*(y2-y1); if(b0===0) return false; let b1=((x2-x)*(y3-y)-(x3-x)*(y2-y))/b0; let b2=((x3-x)*(y1-y)-(x1-x)*(y3-y))/b0; let b3=((x1-x)*(y2-y)-(x2-x)*(y1-y))/b0; return b1>0 && b2>0 && b3>0; }, getPoint:()=>{ let x,y; do{x=280+Math.random()*140; y=150+Math.random()*130;} while(!forestAreas.treeCrown.contains(x,y)); return {x,y}; } },
        trunk: { contains:(x,y)=> x>=335 && x<=365 && y>=280 && y<=320, getPoint:()=>({x:335+Math.random()*30, y:280+Math.random()*40}) },
        mushroomCap: { contains:(x,y)=> Math.hypot(x-500,y-330)<=28 && y>310 && y<360, getPoint:()=>{ let r=Math.sqrt(Math.random())*28, a=Math.random()*Math.PI*2; return {x:500+Math.cos(a)*r, y:330+Math.sin(a)*r}; } },
        mushroomStem: { contains:(x,y)=> x>=490 && x<=510 && y>=340 && y<=380, getPoint:()=>({x:490+Math.random()*20, y:340+Math.random()*40}) },
        sun: { contains:(x,y)=> Math.hypot(x-600,y-100)<=30, getPoint:()=>{ let r=Math.sqrt(Math.random())*30, a=Math.random()*Math.PI*2; return {x:600+Math.cos(a)*r, y:100+Math.sin(a)*r}; } },
        cloud1: { contains:(x,y)=> Math.pow((x-120)/45,2)+Math.pow((y-80)/25,2)<=1, getPoint:()=>{ let a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random()); return {x:120+Math.cos(a)*r*45, y:80+Math.sin(a)*r*25}; } },
        cloud2: { contains:(x,y)=> Math.pow((x-550)/45,2)+Math.pow((y-60)/25,2)<=1, getPoint:()=>{ let a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random()); return {x:550+Math.cos(a)*r*45, y:60+Math.sin(a)*r*25}; } }
    };
    // Черепаха с облаками
    const turtleAreas = {
        shell: { contains:(x,y)=> Math.hypot(x-350,y-290)<=60, getPoint:()=>{ let r=Math.sqrt(Math.random())*60, a=Math.random()*Math.PI*2; return {x:350+Math.cos(a)*r, y:290+Math.sin(a)*r}; } },
        pattern1: { contains:(x,y)=> Math.hypot(x-320,y-270)<=15, getPoint:()=>{ let r=Math.sqrt(Math.random())*15, a=Math.random()*Math.PI*2; return {x:320+Math.cos(a)*r, y:270+Math.sin(a)*r}; } },
        pattern2: { contains:(x,y)=> Math.hypot(x-380,y-270)<=15, getPoint:()=>{ let r=Math.sqrt(Math.random())*15, a=Math.random()*Math.PI*2; return {x:380+Math.cos(a)*r, y:270+Math.sin(a)*r}; } },
        pattern3: { contains:(x,y)=> Math.hypot(x-350,y-320)<=15, getPoint:()=>{ let r=Math.sqrt(Math.random())*15, a=Math.random()*Math.PI*2; return {x:350+Math.cos(a)*r, y:320+Math.sin(a)*r}; } },
        pattern4: { contains:(x,y)=> Math.hypot(x-350,y-250)<=12, getPoint:()=>{ let r=Math.sqrt(Math.random())*12, a=Math.random()*Math.PI*2; return {x:350+Math.cos(a)*r, y:250+Math.sin(a)*r}; } },
        head: { contains:(x,y)=> Math.hypot(x-270,y-260)<=30, getPoint:()=>{ let r=Math.sqrt(Math.random())*30, a=Math.random()*Math.PI*2; return {x:270+Math.cos(a)*r, y:260+Math.sin(a)*r}; } },
        eye: { contains:(x,y)=> Math.hypot(x-260,y-255)<=5, getPoint:()=>{ let r=Math.sqrt(Math.random())*5, a=Math.random()*Math.PI*2; return {x:260+Math.cos(a)*r, y:255+Math.sin(a)*r}; } },
        leg1: { contains:(x,y)=> Math.hypot(x-310,y-350)<=20, getPoint:()=>{ let r=Math.sqrt(Math.random())*20, a=Math.random()*Math.PI*2; return {x:310+Math.cos(a)*r, y:350+Math.sin(a)*r}; } },
        leg2: { contains:(x,y)=> Math.hypot(x-390,y-350)<=20, getPoint:()=>{ let r=Math.sqrt(Math.random())*20, a=Math.random()*Math.PI*2; return {x:390+Math.cos(a)*r, y:350+Math.sin(a)*r}; } },

        leg4: { contains:(x,y)=> Math.hypot(x-390,y-230)<=20, getPoint:()=>{ let r=Math.sqrt(Math.random())*20, a=Math.random()*Math.PI*2; return {x:390+Math.cos(a)*r, y:230+Math.sin(a)*r}; } },

        ctxOutline.beginPath(); ctxOutline.arc(425,245,5,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.arc(350,270,12,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.arc(450,270,12,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.arc(365,310,10,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.arc(435,310,10,0,Math.PI*2); ctxOutline.stroke();
        // облака бабочки
        ctxOutline.beginPath(); ctxOutline.ellipse(180,170,45,25,0,0,Math.PI*2); ctxOutline.ellipse(225,165,40,22,0,0,Math.PI*2); ctxOutline.ellipse(150,180,35,20,0,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.ellipse(580,160,50,28,0,0,Math.PI*2); ctxOutline.ellipse(625,155,45,24,0,0,Math.PI*2); ctxOutline.ellipse(540,165,40,22,0,0,Math.PI*2); ctxOutline.stroke();
        ctxOutline.beginPath(); ctxOutline.arc(600,100,30,0,Math.PI*2); ctxOutline.stroke();
        for(let i=0;i<12;i++){ let a=i*Math.PI*2/12; ctxOutline.beginPath(); ctxOutline.moveTo(600+Math.cos(a)*30,100+Math.sin(a)*30); ctxOutline.lineTo(600+Math.cos(a)*48,100+Math.sin(a)*48); ctxOutline.stroke(); }
        for(let x=40;x<660;x+=30){ ctxOutline.beginPath(); ctxOutline.moveTo(x,420); ctxOutline.quadraticCurveTo(x+8,400,x+15,420); ctxOutline.stroke(); }
        ctxOutline.fillStyle=CONTOUR_COLOR;
        for(let fx=50;fx<680;fx+=45){ ctxOutline.beginPath(); ctxOutline.arc(fx,415,3,0,Math.PI*2); ctxOutline.fill(); ctxOutline.beginPath(); ctxOutline.arc(fx+15,412,2.5,0,Math.PI*2); ctxOutline.fill(); }
        ctxOutline.restore();
    }

    function initPaintLayer() {
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = '#fefaf5';
        ctx.fillRect(0,0,W,H);
        let img = ctx.getImageData(0,0,W,H);
        let d = img.data;
        for(let i=0;i<d.length;i+=4){
            let n = Math.random()*9;
            d[i] = Math.min(255, d[i] + n*0.3);
            d[i+1] = Math.min(255, d[i+1] + n*0.25);
            d[i+2] = Math.min(255, d[i+2] + n*0.2);
        }
        ctx.putImageData(img,0,0);
        saveState();
    }

    function fillArea(areaKey, color) {
        let area = currentAreas[areaKey];
        if(!area) return;
        for(let i=0;i<140;i++){
            let p = area.getPoint();
            let rad = brushSize * (0.5+Math.random()*0.8);
            watercolorDot(p.x, p.y, rad/2, color, false);
        }
        // растекание для некоторых типов
        if(areaKey==='wall'||areaKey==='door'||areaKey==='window'){
            let r = (areaKey==='wall')?{x:280,w:140,y:280,h:120}:(areaKey==='door')?{x:340,w:40,y:340,h:60}:{x:300,w:35,y:310,h:35};
            for(let i=0;i<30;i++){
                let side=Math.floor(Math.random()*4);
                let ex,ey;
                if(side===0){ ex=r.x+Math.random()*r.w; ey=r.y-Math.random()*12; }
                else if(side===1){ ex=r.x+Math.random()*r.w; ey=r.y+r.h+Math.random()*12; }
                else if(side===2){ ex=r.x-Math.random()*12; ey=r.y+Math.random()*r.h; }
                else { ex=r.x+r.w+Math.random()*12; ey=r.y+Math.random()*r.h; }
                watercolorDot(ex, ey, brushSize/2.5, color, true);
            }
        } else if(areaKey==='sun'){
            let cx = (currentPicture==='garden')?620:600;
            let cy = (currentPicture==='garden')?120:100;
            let r = 30;
            for(let i=0;i<30;i++){
                let a=Math.random()*Math.PI*2;
                let ex=cx+Math.cos(a)*(r+Math.random()*10);
                let ey=cy+Math.sin(a)*(r+Math.random()*10);
                watercolorDot(ex, ey, brushSize/2.5, color, true);
            }
        } else if(areaKey.startsWith('cloud')){
            // небольшое растекание облаков
            for(let i=0;i<20;i++){
                let angle=Math.random()*Math.PI*2;
                let ex=area.getPoint().x+Math.cos(angle)*15;
                let ey=area.getPoint().y+Math.sin(angle)*15;
                watercolorDot(ex, ey, brushSize/2.5, color, true);
            }
        }
    }
    function getAreaAt(x,y) {
        for(let key in currentAreas) if(currentAreas[key].contains(x,y)) return key;
        return null;
    }

    function loadOwnImage(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e){
            const img = new Image();
            img.onload = function(){
                initPaintLayer();
                let scale = Math.min(W/img.width, H/img.height);
                let x = (W - img.width*scale)/2;
                let y = (H - img.height*scale)/2;
                ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
                importedImageData = { img: img, scale: scale, x:x, y:y };
                ctxOutline.clearRect(0,0,W,H);
                currentPicture = 'import';
                document.getElementById('fillModeBtn').classList.add('disabled');
                if(mode === 'fill') {
                    mode = 'brush';
                    document.getElementById('brushModeBtn').classList.add('active');
                    document.getElementById('fillModeBtn').classList.remove('active');
                }
                saveState();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function switchToPicture(type) {
        currentPicture = type;
        initPaintLayer();
        if(type === 'house') {
            drawHouseOutline();
            currentAreas = houseAreas;
            document.getElementById('fillModeBtn').classList.remove('disabled');
        } else if(type === 'forest') {
            drawForestOutline();
            currentAreas = forestAreas;
            document.getElementById('fillModeBtn').classList.remove('disabled');
        } else if(type === 'turtle') {
            drawTurtleOutline();
            currentAreas = turtleAreas;
            document.getElementById('fillModeBtn').classList.remove('disabled');
        } else if(type === 'garden') {
            drawGardenOutline();
            currentAreas = gardenAreas;
            document.getElementById('fillModeBtn').classList.remove('disabled');
            if(soundEnabled) startNatureSound();
        } else if(type === 'butterfly') {
            drawButterflyOutline();
            currentAreas = butterflyAreas;
            document.getElementById('fillModeBtn').classList.remove('disabled');
        }
        if(type !== 'garden') stopNatureSound();
        if(mode === 'fill' && document.getElementById('fillModeBtn').classList.contains('disabled')) {
            mode = 'brush';
            document.getElementById('brushModeBtn').classList.add('active');
            document.getElementById('fillModeBtn').classList.remove('active');
        }
        historyStack = [];
        historyIndex = -1;
        saveState();
    }

    // ---------- ОБРАБОТЧИКИ РИСОВАНИЯ ----------
    function getCoords(e) {
        const rect = paintCanvas.getBoundingClientRect();
        const sx = W/rect.width, sy = H/rect.height;
        let cx,cy;
        if(e.touches){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; e.preventDefault(); }
        else { cx=e.clientX; cy=e.clientY; }
        let x = (cx - rect.left)*sx, y = (cy - rect.top)*sy;
        return {x:Math.min(Math.max(0,x),W), y:Math.min(Math.max(0,y),H)};
    }
    let strokeDrawing = false;
    function startStroke(e) {
        if(mode !== 'brush' && mode !== 'pen') return;
        drawing = true;
        strokeDrawing = true;
        let pos = getCoords(e);
        lastX = pos.x; lastY = pos.y;
        let color = (mode === 'pen') ? CONTOUR_COLOR : currentColor;
        drawStroke(lastX, lastY, brushSize, color, mode);
    }
    function moveStroke(e) {
        if(!drawing || (mode !== 'brush' && mode !== 'pen')) return;
        let pos = getCoords(e);
        let cx = pos.x, cy = pos.y;
        let dist = Math.hypot(cx-lastX, cy-lastY);
        let steps = Math.min(22, Math.floor(dist/1.8)+1);
        let color = (mode === 'pen') ? CONTOUR_COLOR : currentColor;
        for(let s=1;s<=steps;s++){
            let t = s/steps;
            let ix = lastX + (cx-lastX)*t;
            let iy = lastY + (cy-lastY)*t;
            drawStroke(ix, iy, brushSize, color, mode);
        }
        lastX = cx; lastY = cy;
    }
    function endStroke() {
        if(strokeDrawing) {
            saveState();
            strokeDrawing = false;
        }
        drawing = false;
    }
    function handleFillClick(e) {
        if(mode !== 'fill') return;
        if(currentPicture === 'import') return;
        let pos = getCoords(e);
        let area = getAreaAt(pos.x, pos.y);
        if(area) {
            saveState();
            fillArea(area, currentColor);
        }
    }
    function clearCanvas() {
        saveState();
        if(currentPicture === 'import' && importedImageData){
            ctx.clearRect(0,0,W,H);
            ctx.fillStyle = '#fefaf5';
            ctx.fillRect(0,0,W,H);
            let d = importedImageData;
            ctx.drawImage(d.img, d.x, d.y, d.img.width*d.scale, d.img.height*d.scale);
        } else {
            initPaintLayer();
            if(currentPicture === 'house') drawHouseOutline();
            else if(currentPicture === 'forest') drawForestOutline();
            else if(currentPicture === 'turtle') drawTurtleOutline();
            else if(currentPicture === 'garden') drawGardenOutline();
            else if(currentPicture === 'butterfly') drawButterflyOutline();
        }
    }

    // ---------- UI ----------
    function buildPalette() {
        const cont = document.getElementById('palette');
        cont.innerHTML = '';
        paletteColors.forEach(c=>{
            let btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.backgroundColor = c;
            btn.addEventListener('click',()=>{
                document.querySelectorAll('#palette .color-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = c;
            });
            cont.appendChild(btn);
        });
        cont.children[0].classList.add('active');
    }

    function buildMenu() {
        const grid = document.getElementById('pictureGrid');
        grid.innerHTML = '';
        const pics = [
            { id: 'house', name: '🏠 Уютный домик', emoji: '🏠' },
            { id: 'forest', name: '🌲 Лесная полянка', emoji: '🌲' },
            { id: 'turtle', name: '🐢 Черепашка', emoji: '🐢' },
            { id: 'garden', name: '🌳 Цветущий сад', emoji: '🌳' },
            { id: 'butterfly', name: '🦋 Большая бабочка', emoji: '🦋' }
        ];
        pics.forEach(pic => {
            const card = document.createElement('div');
            card.className = 'picture-card';
            card.innerHTML = `<span class="emoji">${pic.emoji}</span><div class="title">${pic.name}</div>`;
            card.addEventListener('click', () => {
                switchToPicture(pic.id);
                const menu = document.getElementById('menuOverlay');
                menu.style.opacity = '0';
                setTimeout(() => {
                    menu.style.display = 'none';
                    document.getElementById('gameContainer').style.display = 'block';
                }, 400);
            });
            grid.appendChild(card);
        });
    }

    const menuOverlay = document.getElementById('menuOverlay');
    const gameContainer = document.getElementById('gameContainer');
    document.getElementById('importMenuBtn').addEventListener('click', () => {
        document.getElementById('menuFileInput').click();
    });
    document.getElementById('menuFileInput').addEventListener('change', (e) => {
        if(e.target.files && e.target.files[0]) {
            loadOwnImage(e.target.files[0]);
            menuOverlay.style.opacity = '0';
            setTimeout(() => {
                menuOverlay.style.display = 'none';
                gameContainer.style.display = 'block';
            }, 400);
        }
        e.target.value = '';
    });
    document.getElementById('backToMenuBtn').addEventListener('click', () => {
        gameContainer.style.display = 'none';
        menuOverlay.style.display = 'flex';
        setTimeout(() => { menuOverlay.style.opacity = '1'; }, 10);
    });

    const brushBtn = document.getElementById('brushModeBtn');
    const penBtn = document.getElementById('penModeBtn');
    const fillBtn = document.getElementById('fillModeBtn');
    brushBtn.onclick = () => { mode='brush'; brushBtn.classList.add('active'); penBtn.classList.remove('active'); fillBtn.classList.remove('active'); };
    penBtn.onclick = () => { mode='pen'; penBtn.classList.add('active'); brushBtn.classList.remove('active'); fillBtn.classList.remove('active'); };
    fillBtn.onclick = () => { if(fillBtn.classList.contains('disabled')) return; mode='fill'; fillBtn.classList.add('active'); brushBtn.classList.remove('active'); penBtn.classList.remove('active'); };
    const range = document.getElementById('brushRange');
    const sizeSpan = document.getElementById('brushSizeVal');
    range.oninput = (e) => { brushSize = parseInt(e.target.value); sizeSpan.innerText = brushSize; };
    document.getElementById('clearBtn').onclick = () => clearCanvas();
    document.getElementById('undoBtn').onclick = () => undo();
    document.getElementById('redoBtn').onclick = () => redo();
    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
    });

    paintCanvas.addEventListener('mousedown', (e) => {
        if(mode === 'fill') handleFillClick(e);
        else startStroke(e);
    });
    window.addEventListener('mousemove', moveStroke);
    window.addEventListener('mouseup', endStroke);
    paintCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(mode === 'fill') handleFillClick(e); else startStroke(e); });
    paintCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveStroke(e); });
    paintCanvas.addEventListener('touchend', endStroke);

    buildPalette();
    buildMenu();
    gameContainer.style.display = 'none';
    menuOverlay.style.display = 'flex';
})();
</script>
